name: AI PR Review on Comment

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Print trigger info
        run: |
          echo "EVENT: $GITHUB_EVENT_NAME"
          echo "ACTOR: $GITHUB_ACTOR"
          echo "COMMENT_BODY: '${{ github.event.comment && github.event.comment.body || '' }}'"

      - name: Check for /ai-review trigger
        id: check_trigger
        run: |
          BODY="${{ github.event.comment && github.event.comment.body || '' }}"
          echo "body>>$BODY<<"
          if echo "$BODY" | grep -iq '/ai-review'; then
            echo "triggered=true" >> $GITHUB_OUTPUT
          else
            echo "triggered=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit early if not triggered
        if: ${{ steps.check_trigger.outputs.triggered == 'false' }}
        run: |
          echo "No /ai-review found — skipping."
          exit 0

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create initial "started" comment
        id: create_comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `🤖 **AI Review started** — gathering changed files and running checks... (triggered by @${context.payload.comment ? context.payload.comment.user.login : context.actor})`;
            const issue_number = context.issue.number;
            const resp = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
            return resp.data.id;

      - name: Get changed files (PR)
        id: changed
        uses: tj-actions/changed-files@v34
        with:
          format: "json"

      - name: Compose payload (top 10 text files)
        run: |
          jq -r '.[] | .filename' changed_files.json > files_list.txt || true
          head -n 10 files_list.txt > files_top.txt || true
          printf "" > /tmp/review_payload.txt
          while read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ]; then
              echo -e "\n\n--- FILE: $f ---\n" >> /tmp/review_payload.txt
              head -n 2000 "$f" >> /tmp/review_payload.txt
            fi
          done < files_top.txt || true
          if [ ! -s /tmp/review_payload.txt ]; then
            echo "(No changed files found or files are binary.)" > /tmp/review_payload.txt
          fi
          echo "Payload saved to /tmp/review_payload.txt"
          head -n 80 /tmp/review_payload.txt || true

      - name: Call OpenAI or write fallback (single script)
        id: call_openai_or_fallback
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          OUT=/tmp/ai_text.txt
          PAYLOAD=/tmp/review_payload.txt

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OpenAI key not set in repo secrets." > "$OUT"
            echo "" >> "$OUT"
            echo "Payload preview:" >> "$OUT"
            head -n 200 "$PAYLOAD" >> "$OUT"
            exit 0
          fi

          PROMPT="You are a senior frontend engineer. Review changed files and provide a concise summary of issues (bugs, security, performance, tests missing) and actionable recommendations with file references where possible. Keep reply concise."

          CODE_SNIPPET=$(sed -n '1,2000p' "$PAYLOAD" | sed 's/"/\\"/g')
          FULL_PROMPT="$PROMPT\n\n$CODE_SNIPPET"

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$(jq -n --arg m "$FULL_PROMPT" '{model:"gpt-4o-mini", messages:[{role:"user", content:$m}], max_tokens:900}')")

          AI_TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          if [ -z "$AI_TEXT" ]; then
            echo "OpenAI returned empty or error. Raw response below." > "$OUT"
            echo "" >> "$OUT"
            echo "$RESPONSE" >> "$OUT"
            exit 0
          fi

          echo "$AI_TEXT" > "$OUT"
          echo "WROTE AI output to $OUT"

      - name: Post final review (update initial comment)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const OUT_PATH = '/tmp/ai_text.txt';
            let text = '(no output)';
            try {
              text = fs.readFileSync(OUT_PATH, 'utf8').toString();
            } catch (e) {
              text = '(failed to read AI output file)';
            }
            if (text.length > 30000) text = text.slice(0,30000) + "\n\n*(truncated)*";
            const body = `## 🤖 AI Review — result\n\n${text}\n\n*If output is empty or truncated, check Actions logs.*`;
            const commentId = parseInt('${{ steps.create_comment.result }}', 10) || null;
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
